<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My English Wordbook</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    max-width: 650px;
    margin: auto;
    padding: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

.input-area {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    padding: 14px;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 10px;
}

button {
    padding: 12px 18px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
}

button:disabled {
    opacity: 0.5;
}

.card {
    background: white;
    padding: 20px;
    margin-top: 15px;
    border-radius: 15px;
}

.word {
    font-size: 30px;
    font-weight: bold;
}

.meaning {
    margin-top: 10px;
    font-size: 20px;
}

.loading {
    color: #777;
}
</style>
</head>

<body>

<h1>📚 My English Wordbook</h1>

<div class="input-area">
    <input id="wordInput" placeholder="英単語を入力">
    <button id="addButton" onclick="addWord()">追加</button>
</div>

<div id="wordList"></div>

<script>

let words = JSON.parse(localStorage.getItem("words")) || [];

function displayWords() {

    const list = document.getElementById("wordList");

    list.innerHTML = "";

    words.forEach((item) => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="word">${escapeHTML(item.word)}</div>
            <div class="meaning">${escapeHTML(item.meaning)}</div>
        `;

        list.appendChild(card);
    });
}


async function addWord() {

    const input = document.getElementById("wordInput");
    const button = document.getElementById("addButton");

    const word = input.value.trim();

    if (word === "") return;

    button.disabled = true;
    button.textContent = "検索中";

    try {

        const url =
            "https://api.mymemory.translated.net/get?q="
            + encodeURIComponent(word)
            + "&langpair=en|ja";

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("API error");
        }

        const data = await response.json();

        let meaning =
            data.responseData?.translatedText;

        if (!meaning) {
            meaning = "日本語訳を取得できませんでした";
        }

        words.unshift({
            word: word,
            meaning: meaning
        });

        localStorage.setItem("words", JSON.stringify(words));

        input.value = "";

        displayWords();

    } catch (error) {

        alert("日本語訳を取得できませんでした。もう一度試してください。");

        console.error(error);

    } finally {

        button.disabled = false;
        button.textContent = "追加";

    }
}


function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


displayWords();

</script>

</body>
</html>
