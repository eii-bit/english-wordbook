<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My English Wordbook</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    max-width: 650px;
    margin: auto;
    padding: 20px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

.input-area {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    padding: 14px;
    font-size: 18px;
    border: 1px solid #ccc;
    border-radius: 10px;
}

button {
    padding: 10px 15px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
}

.card {
    background: white;
    padding: 20px;
    margin-top: 15px;
    border-radius: 15px;
}

.word {
    font-size: 28px;
    font-weight: bold;
}

.meaning {
    margin-top: 10px;
    font-size: 20px;
}

.delete {
    margin-top: 15px;
    background: #d33;
}
</style>
</head>

<body>

<h1>📚 My English Wordbook</h1>

<div class="input-area">
    <input id="wordInput" placeholder="英単語を入力">
    <button onclick="addWord()">追加</button>
</div>

<div id="wordList"></div>

<script>

let words = JSON.parse(localStorage.getItem("words")) || [];

function displayWords() {

    const list = document.getElementById("wordList");

    list.innerHTML = "";

    words.forEach((item, index) => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="word">${escapeHTML(item.word)}</div>
            <div class="meaning">${escapeHTML(item.meaning)}</div>
            <button class="delete" onclick="deleteWord(${index})">
                この単語を削除
            </button>
        `;

        list.appendChild(card);
    });
}

async function addWord() {

    const input = document.getElementById("wordInput");

    const word = input.value.trim();

    if (word === "") return;

    const url =
        "https://api.mymemory.translated.net/get?q="
        + encodeURIComponent(word)
        + "&langpair=en|ja";

    try {

        const response = await fetch(url);
        const data = await response.json();

        const meaning =
            data.responseData?.translatedText
            || "日本語訳を取得できませんでした";

        words.unshift({
            word: word,
            meaning: meaning
        });

        localStorage.setItem("words", JSON.stringify(words));

        input.value = "";

        displayWords();

    } catch (error) {

        alert("日本語訳を取得できませんでした。");

    }
}

function deleteWord(index) {

    const answer = confirm("この単語を削除しますか？");

    if (!answer) return;

    words.splice(index, 1);

    localStorage.setItem("words", JSON.stringify(words));

    displayWords();
}

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

displayWords();

</script>

</body>
</html>
