<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語帳</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f7fa;
      color: #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 20px;
      color: #2c3e50;
    }
    .card-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .word {
      font-size: 1.2rem;
      font-weight: bold;
      color: #1a0dab;
    }
    .meaning {
      font-size: 1rem;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>My English Wordbook</h1>

  <div class="card-container">
    <div class="card">
      <span class="word">apple</span>
      <span class="meaning">りんご</span>
    </div>
    <div class="card">
      <span class="word">book</span>
      <span class="meaning">本</span>
    </div>
    <div class="card">
      <span class="word">study</span>
      <span class="meaning">勉強する</span>
    </div>
  </div>

</body>
</html>
